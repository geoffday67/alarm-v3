; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:adafruit_feather_esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = adafruit_feather_esp32c6
framework = arduino
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
upload_speed = 921600
upload_port = /dev/cu.usbserial-A5069RR4
;upload_flags = --no-stub
monitor_speed = 115200
monitor_port = /dev/cu.usbserial-A5069RR4
build_unflags =
    -D ARDUINO_USB_CDC_ON_BOOT
build_flags =
	-Iinclude
	;-D CORE_DEBUG_LEVEL=5
  -D ARDUINO_USB_CDC_ON_BOOT=0

extra_scripts = post:post_upload_reset.py

lib_extra_dirs = 
	/Users/geoff/Documents/Arduino library

lib_deps =
	earlephilhower/BackgroundAudio@^1.4.4
	adafruit/Adafruit GFX Library@^1.12.6
